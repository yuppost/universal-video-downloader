name: Build Windows app

# Run it by hand (Actions tab > "Build Windows app" > Run workflow) or push a tag such as v1.1.0 to also publish a Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write            # needed only to attach the zip to a Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"     # actions run on Node 24 (Node 20 is being removed from the runners)

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build (tests + PyInstaller + FFmpeg/Deno bundle)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
          UVS_NO_AUDIO: "1"
        run: build.bat

      - name: Zip
        shell: pwsh
        run: |
          if (-not (Test-Path dist/UniversalVideoStudio/UniversalVideoStudio.exe)) { throw "exe missing" }
          Compress-Archive -Path dist/UniversalVideoStudio -DestinationPath UniversalVideoStudio-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: UniversalVideoStudio-windows
          path: UniversalVideoStudio-windows.zip
          if-no-files-found: error

      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" UniversalVideoStudio-windows.zip --title "${{ github.ref_name }}" --generate-notes
